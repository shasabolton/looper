<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Looper</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <button id="looper" class="looper stopped" type="button" aria-live="polite">
        <span id="stateText" class="state-text">Tap to record</span>
        <span id="hintText" class="hint-text">Double tap stops playback. Hold to undo.</span>
      </button>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
